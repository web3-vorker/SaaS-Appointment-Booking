[pytest]
# Pytest конфигурация для SaaS проекта

# Где искать тесты
testpaths = tests

# Паттерны для поиска тестов
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Опции по умолчанию
addopts = 
    -v
    --strict-markers
    --tb=short
    --disable-warnings
    
# Маркеры для категоризации тестов
markers =
    unit: Unit тесты (быстрые, изолированные)
    integration: Integration тесты (требуют БД)
    e2e: End-to-end тесты (полные сценарии)
    slow: Медленные тесты
    
# Asyncio настройки
asyncio_mode = auto

# Покрытие кода
[coverage:run]
source = app
omit = 
    */tests/*
    */migrations/*
    */__pycache__/*
    */venv/*
    */.venv/*

[coverage:report]
precision = 2
show_missing = True
skip_covered = False
